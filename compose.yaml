name: energo-pvo

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./templates/approved:/app/templates/approved:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-300m}
      NGINX_ENVSUBST_FILTER: ^NGINX_CLIENT_MAX_BODY_SIZE$
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8000}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --quiet --output-document=/dev/null http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
