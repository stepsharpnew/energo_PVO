[project]
name = "executive-docs-agent"
version = "0.1.0"
description = "Local AI agent MVP for Russian executive documentation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "openai>=1.99,<3",
  "pydantic>=2.11,<3",
  "pypdf>=5.9,<7",
  "openpyxl>=3.1,<4",
  "lxml>=5.4,<7",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
]

[project.scripts]
executive-docs = "executive_docs.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/executive_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
